name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Shared package tests
        working-directory: Shared
        run: swift test

      - name: Build Mac app (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild -project DesktopAR.xcodeproj -scheme MacHost -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build | tail -n 20

      - name: Build iPhone app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project DesktopAR.xcodeproj -scheme PhoneClient -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            build | tail -n 20

      - name: Package DMG, ZIP and IPA
        run: |
          mkdir -p dist dmg
          MAC_APP=build/Build/Products/Release/Shellbreak.app
          IOS_APP=build/Build/Products/Release-iphoneos/Shellbreak.app

          ditto -c -k --keepParent "$MAC_APP" dist/Shellbreak-macOS.zip

          cp -R "$MAC_APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Shellbreak -srcfolder dmg -ov -format UDZO dist/Shellbreak-macOS.dmg

          mkdir -p Payload
          cp -R "$IOS_APP" Payload/
          zip -qry dist/Shellbreak-iOS-unsigned.ipa Payload

          (cd dist && shasum -a 256 * > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: shellbreak-${{ github.sha }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Mac:** download `Shellbreak-macOS.dmg`, drag Shellbreak to Applications, then right-click → Open the first time.
            **iPhone:** `Shellbreak-iOS-unsigned.ipa` must be signed with your own Apple ID — use Sideloadly or AltStore (works from a Mac or a Windows PC). See README → "Option B".
            The iPhone app always needs the Mac app as its host.
